<!DOCTYPE html>
<html lang="id">
<head>
  <img src="profile.jpg" alt="Khoiru Falazain Abbiyu" class="profile-img">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoiru Falazain Abbiyu - Linktree</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #ffffff;
        }

        p.bio {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: block;
            padding: 12px 20px;
            background-color: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .link-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Foto Profil Avatar Custom -->
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Abbiyu" alt="Khoiru Falazain Abbiyu" class="profile-img">
        
        <h1>Khoiru Falazain Abbiyu</h1>
        <p class="bio">Computer & Network Engineering Student | Tech Enthusiast</p>

        <div class="links-container">
            <a href="https://www.tiktok.com/@abbiyou_" target="_blank" class="link-btn">🎵 TikTok (@abbiyou_)</a>
            <a href="https://github.com" target="_blank" class="link-btn">🐱 GitHub</a>
            <a href="https://instagram.com" target="_blank" class="link-btn">📸 Instagram</a>
        </div>

        <footer>
            © <span id="year"></span> Khoiru Falazain Abbiyu
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
